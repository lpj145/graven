[package]
name = "graven-compiler"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories = ["encoding", "command-line-utilities", "development-tools::build-utils"]
readme = "../../README.md"
description = "gravenc: compiler for the .graven schema language, with lockfile and compatibility checks."

[lib]
name = "graven_compiler"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"
graven = { version = "0.3.3", path = "../graven" }
graven-layout = { version = "0.3.3", path = "../graven-layout" }
graven-dynamic = { version = "0.3.3", path = "../graven-dynamic" }
serde_json = { version = "1", features = ["preserve_order"] }
bytes = "1"
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["full"] }
prettyplease = "0.3"

[dev-dependencies]
proptest = "1"
graven-schemas = { path = "../graven-schemas" }
graven-conformance = { path = "../graven-conformance" }

[[bin]]
name = "gravenc"
path = "src/main.rs"
