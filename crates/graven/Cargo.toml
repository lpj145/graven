[package]
name = "graven"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories = ["encoding", "no-std"]
readme = "../../README.md"
description = "Runtime for the Graven zero-copy binary format: builder, checked and verified readers, envelope."

[features]
default = ["std"]
std = ["bytes/std", "dep:crc32c"]

[dependencies]
bytes = { version = "1", default-features = false }
crc32c = { version = "0.6.9", optional = true }

[dev-dependencies]
proptest = "1"

# These tests use `SimplePool`, which only exists with `std`.
[[test]]
name = "allocs"
required-features = ["std"]

[[test]]
name = "writer_limits"
required-features = ["std"]

[[test]]
name = "bytes_list"
required-features = ["std"]

[[test]]
name = "rt"
required-features = ["std"]
